server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    # Forward all /api/* requests to the backend container (strips the /api prefix)
    location /api/ {
        proxy_pass http://api:8200/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    # Allow embedding in iframes from any origin
    add_header Content-Security-Policy "frame-ancestors *" always;
    # Explicitly unset X-Frame-Options so it doesn't conflict with the CSP above
    add_header X-Frame-Options "" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Serve the React SPA — all other paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }
}
